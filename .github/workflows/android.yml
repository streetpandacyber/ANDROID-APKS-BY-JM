name: ShopMate Offline CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shopmate-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TypeScript, tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Lint
        run: pnpm lint

  android:
    name: Submit EAS Android APK build
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing required GitHub Actions secret: EXPO_TOKEN"
            echo "Add an Expo access token at Settings > Secrets and variables > Actions."
            exit 1
          fi
      - name: Install Expo CLI
        run: npm install --global eas-cli@latest
      - name: Verify Expo account and project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami && eas project:info --non-interactive
      - name: Submit EAS Android APK build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_NO_VCS: "1"
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            PROFILE=production
          else
            PROFILE=preview
          fi
          echo "Submitting $PROFILE Android APK build to EAS for @lenajabas-team/shopmate-offline"
          eas build --platform android --profile "$PROFILE" --non-interactive --no-wait
